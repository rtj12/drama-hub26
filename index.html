<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drama Hub</title>
<script>try{var t=localStorage.getItem('dhTheme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--panel:#121212;--panel2:#1b1b1b;--line:#2c2616;--gold:#d4af37;--ac:#01411C;--acx:#f2eee3;--act:#2fa863;--text:#f2eee3;--mut:#9b9784;--pw:190px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=charcoal]{--bg:#161616;--panel:#212121;--panel2:#2b2b2b}
html[data-accent=gold]{--ac:#d4af37;--acx:#1a1400;--act:#d4af37}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(900px 420px at 50% -8%,#2c230a 0,transparent 70%),radial-gradient(800px 520px at 100% 100%,#002a0e 0,transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0;font-weight:800}
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 36px 14px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--gold),transparent) 1;position:sticky;top:0;background:#050505ee;backdrop-filter:blur(10px);z-index:20;flex-wrap:wrap}
.logo{font:800 60px/1.1 'Playfair Display',serif;color:#01411C;white-space:nowrap;letter-spacing:1px;text-align:center}.logo b{color:#01411C}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
nav a{color:var(--mut);text-decoration:none;padding:9px 20px;border:1px solid var(--line);border-radius:99px;transition:.25s;font-weight:500;font-size:15px}
nav a:hover{color:var(--text);border-color:var(--gold);background:var(--panel2)}nav a.on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.hi{color:var(--mut);font-size:13px;position:absolute;right:36px;top:18px}
main{padding:30px 36px 60px;max-width:1500px;margin:auto}
.fade{animation:f .45s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html[data-anim=off] *{animation:none!important;transition:none!important}
h2{font-size:40px;margin-bottom:6px;letter-spacing:.5px;background:linear-gradient(90deg,#f4e4a6,var(--gold) 50%,#a8841f);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mut);margin:0 0 22px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.sp{flex:1}
button,.btn{font:600 14px Inter,sans-serif;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line);transition:.2s}
button:hover{transform:translateY(-2px);border-color:var(--gold)}button:active{transform:scale(.97)}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.pri:hover{box-shadow:0 6px 22px #01411Caa}
button.dng{color:#ff7b7b}button.on{border-color:var(--gold);color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;background:#0b0b0b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
select{width:auto}label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pw),1fr));gap:22px}
.card{cursor:pointer;position:relative;transition:.3s}.card:hover{transform:translateY(-6px)}
.card:hover .pst{border-color:var(--gold);box-shadow:0 14px 34px #d4af3726}
.pst{aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:1px solid #3a3118;box-shadow:0 12px 32px #000a;background:var(--panel);transition:.45s cubic-bezier(.2,.7,.2,1)}
.pst img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}.card:hover .pst img{transform:scale(1.06)}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(160deg,#1c1808,#0c2216);color:var(--gold);font:800 54px 'Playfair Display',serif}
.ct{font-weight:600;margin-top:9px;line-height:1.25}.cm{color:var(--mut);font-size:13px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;padding:0;border-radius:50%;background:#000a;font-size:17px;color:var(--mut)}.heart.on{color:#ff4d6d}
.stars{position:relative;display:inline-block;color:#4a4a4a;letter-spacing:2px;white-space:nowrap}
.stars i{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold);font-style:normal}
.stars.int{cursor:pointer;font-size:26px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;transition:.25s}
.row:hover{border-color:var(--gold);transform:translateX(4px)}.row .pst{width:54px;flex:none}
.row .ct{margin:0}.rk{font:800 28px 'Playfair Display',serif;color:var(--gold);width:48px;text-align:center}
.top3{display:flex;justify-content:center;align-items:flex-end;gap:3.5vw;margin:30px 0}
.top3 .p{width:min(18vw,230px);text-align:center}.top3 .p.c{width:min(27vw,350px)}
.top3 .pst{border:2px solid var(--gold);box-shadow:0 0 40px #d4af3730}
.top3 .p.c .pst{box-shadow:0 0 70px #d4af3755}
.top3 .n{font:800 26px 'Playfair Display',serif;color:var(--gold);margin-top:10px}.top3 .c .n{font-size:34px}
.hero{text-align:center;margin-top:10px}.hero h1{font-size:52px}.hero p{color:var(--mut)}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;border:1px solid var(--ac);color:var(--act);font-size:12.5px;margin-right:6px}
.det{display:grid;grid-template-columns:min(30vw,340px) 1fr;gap:40px}
.det dl{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;margin:20px 0}.det dt{color:var(--mut)}.det dd{margin:0;white-space:pre-wrap}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.rvc{display:flex;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.25s}.rvc:hover{border-color:var(--gold)}
.rvc .pst{width:120px;flex:none}.rvc p{color:#d6d1c0;white-space:pre-wrap;margin:8px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.stat{background:linear-gradient(160deg,var(--panel),#0e1a12);border:1px solid var(--line);border-radius:16px;padding:24px}
.stat .v{font:800 40px/1.1 'Playfair Display',serif;color:var(--gold);margin:6px 0}.stat span{color:var(--mut)}
.ost{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.ost .pst{width:84px;flex:none;aspect-ratio:1}.ost a{color:var(--act);font-weight:600;text-decoration:none}.ost a:hover{text-decoration:underline}
.osts{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.mod{position:fixed;inset:0;background:#000c;display:grid;place-items:start center;overflow:auto;padding:30px 16px;z-index:50;animation:f .25s}
.mod>div{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:26px;width:min(720px,100%)}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.fm .w{grid-column:1/-1}.fm select{width:100%}
.set{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;max-width:720px}.set h3{margin-bottom:12px}
.set .g{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:60px 0}
#lock[hidden]{display:none}
#lock{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;place-items:center;text-align:center}
#lock>div{width:min(340px,90%)}#lock a{color:var(--act)}#lock input{margin:18px 0 12px;text-align:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:120}#toast.s{opacity:1}
.row,.rvc,.ost,.set{background:linear-gradient(145deg,#171509,#0a0a0a);border-color:#3a3118;box-shadow:0 10px 30px #0009}
.stat{background:linear-gradient(160deg,#18150a,#06140b);border-color:#3a3118;position:relative;overflow:hidden;box-shadow:0 10px 30px #0009}
.stat::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stat .v{background:linear-gradient(90deg,#f4e4a6,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
button.pri{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#000));border-color:#d4af3777}
button.pri:hover{border-color:var(--gold)}
nav a{letter-spacing:.4px}nav a.on{border-color:var(--gold);box-shadow:0 0 20px #d4af3733}
.hero::after{content:"";display:block;width:140px;height:2px;margin:20px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero h1{background:linear-gradient(90deg,#f4e4a6,var(--gold) 50%,#a8841f);-webkit-background-clip:text;background-clip:text;color:transparent}
.top3 .p.c .pst{box-shadow:0 0 90px #d4af3744,0 30px 60px #000}
.sub{letter-spacing:.3px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px #d4af3722}
.mod{backdrop-filter:blur(8px)}.mod>div{box-shadow:0 30px 90px #000}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#050505}::-webkit-scrollbar-thumb{background:#3a3118;border-radius:9px}
html{scroll-behavior:smooth}::selection{background:#d4af3744}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
header{background:#050505b8;backdrop-filter:blur(18px) saturate(1.3);padding-top:22px;padding-bottom:16px;gap:14px}
nav{gap:6px}nav a{border:1px solid transparent;padding:9px 18px;letter-spacing:.5px}
nav a:hover{background:none;border-color:#d4af3755}nav a.on:hover{background:var(--ac);border-color:var(--gold)}
main{padding:46px 56px 96px;max-width:1560px}
h2{font-size:44px;margin-bottom:8px}.sub{color:#8f8b78;margin-bottom:30px;font-size:15.5px}
.ct{letter-spacing:.2px}.grid{gap:30px 26px}
.pst{position:relative}.pst::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#ffffff12,transparent 28%,#00000070)}
.card:hover{transform:translateY(-8px)}.card:hover .pst{box-shadow:0 22px 50px #000,0 0 40px #d4af3733}
.row,.rvc,.ost,.set,.stat{border-radius:16px;border:1px solid #d4af3724;box-shadow:inset 0 1px 0 #ffffff0d,0 18px 40px #000a}
.stat{padding:30px}.stat .v{font-size:48px}
button{border-radius:10px;letter-spacing:.3px}
button.pri{position:relative;overflow:hidden}button.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff26 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}button.pri:hover::after{transform:translateX(120%)}
input,select,textarea{border-color:#3a3118;background:#080808;border-radius:10px}
.top3{position:relative;margin:50px 0 40px}.top3::before{content:"";position:absolute;left:50%;top:50%;width:min(70vw,900px);height:130%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,#d4af3730,transparent);pointer-events:none;z-index:-1}
.top3 .n{font-size:30px}.top3 .c .n{font-size:40px}
#lock{background:radial-gradient(800px 500px at 50% 25%,#251c07,transparent 70%),radial-gradient(800px 500px at 50% 115%,#01411C99,transparent 70%),var(--bg)}
#lock>div{width:min(390px,92%);padding:44px 36px;border:1px solid #d4af3733;border-radius:24px;background:linear-gradient(160deg,#15120a,#070707);box-shadow:0 40px 100px #000,0 0 90px #d4af3714}
#lock input{background:#050505;border-radius:10px}
header{position:static;background:none;backdrop-filter:none;border-image:none;border-bottom:0;padding:28px 36px 0}
nav{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-wrap:nowrap;gap:4px;padding:8px;border-radius:24px;background:#0a0a0acc;backdrop-filter:blur(22px) saturate(1.4);border:1px solid #d4af3733;box-shadow:0 24px 70px #000,0 0 50px #d4af3718;max-width:96vw;overflow-x:auto}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:78px;padding:9px 12px;border-radius:16px;font-size:12px;letter-spacing:.4px}
nav a span{font-size:20px;line-height:1;transition:.25s}nav a:hover span{transform:translateY(-2px);color:var(--gold)}nav a.on span{color:var(--text)}

.logo::before{margin-bottom:16px}.logo::after{margin-top:16px}.logo b{color:inherit;font-weight:inherit}
#lock .logo{font-size:22px!important;letter-spacing:.4em;padding-left:.4em}
.ur{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;direction:rtl;color:#c9a24a;line-height:2.1;font-weight:500}
header .ur{font-size:19px;margin-top:4px}.hero p.ur{font-size:22px;color:#c9a24a;margin:4px 0 0}
footer{text-align:center;padding:10px 0 130px;font-size:19px;opacity:.85}main{padding-bottom:30px}
.hero::after{width:220px;height:28px;margin:14px auto 0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='28'><defs><mask id='m'><rect width='220' height='28' fill='white'/><circle cx='113' cy='14' r='7' fill='black'/></mask></defs><circle cx='107' cy='14' r='9' fill='%23d4af37' mask='url(%23m)'/><polygon points='124.0,7.5 125.4,11.1 129.2,11.3 126.2,13.7 127.2,17.4 124.0,15.3 120.8,17.4 121.8,13.7 118.8,11.3 122.6,11.1' fill='%23d4af37'/><path d='M0 14H84M142 14H220' stroke='%23d4af37' stroke-opacity='.55'/></svg>") center/contain no-repeat}

.stat{background:var(--jali),linear-gradient(160deg,#12261aee,#050e08ee)}
nav{background:#06100acc}
#lock{background:var(--bgimg) center top/cover no-repeat,#040a06}

.top3 .pst{border-radius:50% 50% 12px 12px/26% 26% 12px 12px}
.en{font-size:12.5px;letter-spacing:.8px;color:#8f8b78;margin:0}header .en{margin-top:-4px}.hero p.en{margin-top:-2px;color:#8f8b78}
.hero::after{width:140px;height:2px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tag{font:italic 500 clamp(14px,1.5vw,19px)/1.5 'Playfair Display',Georgia,serif;color:#d9b866;text-align:center;max-width:min(92vw,680px);margin:2px auto 0;padding:0 8px}
.logo{font-size:clamp(20px,3vw,32px)}.hero h1{font-size:clamp(32px,4.6vw,52px)}h2{font-size:clamp(30px,3.6vw,44px)}
main,header{padding-left:clamp(16px,4vw,56px);padding-right:clamp(16px,4vw,56px)}
footer{padding-top:60px;opacity:1}footer .logo{font-size:clamp(16px,2vw,20px)}footer .tag{margin-top:18px}

#lockbg{animation:drift 30s ease-in-out infinite alternate}@keyframes drift{from{transform:scale(1)}to{transform:scale(1.06)}}

</style></head><body>
<div id="lock" hidden></div><div id="lockbg"></div><canvas id="pt"></canvas>
<header><div class="logo">Drama <b>Hub</b></div><span class="hi" id="hi"></span></header>
<nav id="nav"></nav>
<main><div id="view"></div></main><footer><div class="logo">Drama <b>Hub</b></div><div class="tag">Every drama tells a story, but every OST leaves a feeling</div></footer><div id="mod"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GEN=['Romance','Comedy','Drama','Thriller','Action','Family','Mystery','Revenge'];
const STA=['Currently Watching','Completed','Planned','Dropped','Airing','On Hold'];
const REW=['Not rewatched','Want to rewatch','Rewatched'];
const NAV=['Home','Dramas','Reviews','Rankings','Status','OSTs','Favourites','Statistics','Settings'];
const slug=n=>n.toLowerCase();
let S={dramas:[],osts:[],settings:{name:'',accent:'green',theme:'black',size:'190px',anim:'on',pass:'',user:''}};
let ui={genre:'All',mode:'grid',status:STA[0]},tmp={};
let memOnly=false;
/* storage: IndexedDB */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('dramahub',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kvGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
async function kvSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
let col=null,saved={},q=Promise.resolve();
const docsOf=()=>{const m={settings:S.settings};S.dramas.forEach(d=>m['d_'+d.id]=d);S.osts.forEach(o=>m['o_'+o.id]=o);return m};
async function doPersist(){
 try{await kvSet('db',S)}catch(e){}
 if(!col)return;
 try{const want=docsOf();
  for(const k in want){const j=JSON.stringify(want[k]);if(saved[k]!==j){await col.doc(k).set(JSON.parse(j));saved[k]=j}}
  for(const k of Object.keys(saved)){if(!(k in want)){await col.doc(k).delete();delete saved[k]}}
 }catch(e){toast('Could not sync to your account. Changes are kept on this device.')}}
const persist=()=>q=q.then(doPersist);
async function loadData(){
 let local;try{local=await kvGet('db')}catch{memOnly=true}
 try{const cl=window.claude;if(!cl)throw 0;const user=await cl.use('user'),db=await cl.use('db');
  if(user&&db){const id=await user.id();if(id){const c=db.collection('data/users/'+id);
   const snap=await Promise.race([c.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);col=c;
   if(snap.docs.length){const dr=[],os=[];let st={};
    snap.docs.forEach(x=>{const v=JSON.parse(JSON.stringify(x.data()));saved[x.id]=JSON.stringify(v);if(x.id==='settings')st=v;else if(x.id[0]==='d')dr.push(v);else if(x.id[0]==='o')os.push(v)});
    S={dramas:dr,osts:os,settings:{...S.settings,...st}};return}}}
 }catch(e){col=null;saved={}}
 if(local)S={...S,...local,settings:{...S.settings,...local.settings}}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('s'),2400)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId=id=>S.dramas.find(d=>d.id===id);
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dh:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return btoa(unescape(encodeURIComponent(s)))}}
function img2url(file,max=600){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let qv=.8,u=c.toDataURL('image/jpeg',qv);while(u.length>220000&&qv>.4){qv-=.1;u=c.toDataURL('image/jpeg',qv)}res(u)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
/* components */
const poster=(o,t)=>`<div class="pst">${o.img?`<img src="${o.img}" alt="${esc(t||o.title)}">`:`<div class="ph">${esc((t||o.title||'?').trim().charAt(0).toUpperCase())}</div>`}</div>`;
const stars=(v,id)=>`<span class="stars${id?' int':''}" ${id?`data-rate="${id}" title="Click to rate (half stars allowed)"`:''}><i style="width:${(v||0)/5*100}%">★★★★★</i>★★★★★</span>`;
const rtxt=v=>v?`${v}/5`:'Not rated';
const heart=d=>`<button class="heart${d.fav?' on':''}" data-act="fav" data-id="${d.id}" aria-label="Toggle favourite">${d.fav?'♥':'♡'}</button>`;
const THEMES=[{id:'black',name:'Black and gold',a:'#050a06',b:'#d4af37'},{id:'cream',name:'Cream and navy',a:'#f4edda',b:'#14264a'},{id:'ivory',name:'Ivory and burgundy',a:'#f8f3e8',b:'#7a1530'},{id:'flag',name:'Flag',a:'#01391b',b:'#f6f6f0'},{id:'sandstone',name:'Badshahi sandstone',a:'#ecd7b8',b:'#a63d24'},{id:'multan',name:'Multan blue pottery',a:'#f6f9fd',b:'#1b44a3'},{id:'truck',name:'Truck art',a:'#1a1033',b:'#ff3d81'}];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const castOf=d=>(d.cast||'').split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
const hasAir=d=>d.airday!==undefined&&d.airday!==null&&d.airday!=='';
const airTxt=d=>{const k=(+d.airday-new Date().getDay()+7)%7;return 'New episode '+(k===0?'today':k===1?'tomorrow':DAYS[d.airday]+' (in '+k+' days)')};
const air=d=>d.status==='Airing'&&hasAir(d)?`<div class="cm" style="color:var(--act)">${airTxt(d)}</div>`:'';
const spoil=t=>`<span class="${S.settings.blur==='off'?'':'spoil'}">${esc(t)}</span>`;
const doneYear=d=>new Date(d.done||addedOf(d)).getFullYear();
const prog0=d=>d.status==='Currently Watching'&&+d.eps>0?`<div class="pg"><i style="width:${Math.min(100,(d.watched||0)/d.eps*100)}%"></i></div><div class="cm">Episode ${d.watched||0} of ${esc(d.eps)}</div>`:'';
const addedOf=d=>d.added||parseInt(String(d.id).slice(0,8),36)||0;
const SORT={title:(a,b)=>a.title.localeCompare(b.title),rating:(a,b)=>(b.rating||0)-(a.rating||0)||a.title.localeCompare(b.title),year:(a,b)=>(+b.year||0)-(+a.year||0),added:(a,b)=>addedOf(b)-addedOf(a)};
const prog=d=>prog0(d)+air(d);
function yearReview(){const cy=new Date().getFullYear(),yr=ui.year||cy,done=S.dramas.filter(d=>d.status==='Completed'),yrs=[...new Set([cy,...done.map(doneYear)])].sort((a,b)=>b-a),l=done.filter(d=>doneYear(d)===yr),rated=l.filter(d=>d.rating>0),top=[...rated].sort((a,b)=>b.rating-a.rating).slice(0,5),gc={};
 l.forEach(d=>{if(d.genre)gc[d.genre]=(gc[d.genre]||0)+1});const fg=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0],eps=l.reduce((a,d)=>a+(+d.eps||0),0),av=rated.length?(rated.reduce((a,d)=>a+d.rating,0)/rated.length).toFixed(2):'—';
 const t=(k,v)=>`<div><span>${k}</span><div class="v">${esc(v)}</div></div>`;
 return `<div class="stat" style="margin-top:20px"><div class="bar" style="margin:0"><span>Year in review</span><span class="sp"></span><select data-chg="year">${yrs.map(y=>`<option${y===yr?' selected':''}>${y}</option>`).join('')}</select></div>`+(l.length?`<div class="yg">${t('Dramas finished',l.length)}${t('Episodes watched',eps)}${t('Average rating',av)}${t('Favourite genre',fg?fg[0]:'—')}</div>`+(top.length?`<div style="margin-top:22px"><span>Top dramas of ${yr}</span><div class="grid" style="--pw:120px;margin-top:12px">${top.map((d,i)=>`<div class="card" data-go="drama/${d.id}">${poster(d)}<div class="ct">${i+1}. ${esc(d.title)}</div><div class="cm">${stars(d.rating)}</div></div>`).join('')}</div></div>`:''):`<p class="cm" style="margin:14px 0 0">Nothing completed in ${yr} yet.</p>`)+`</div>`}
const card=d=>`<div class="card" data-go="drama/${d.id}">${heart(d)}${poster(d)}<div class="ct">${esc(d.title)}</div><div class="cm">${stars(d.rating)} ${rtxt(d.rating)}</div>${prog(d)}</div>`;
const rowv=d=>`<div class="row" data-go="drama/${d.id}">${poster(d)}<div style="flex:1"><div class="ct">${esc(d.title)}</div><div class="cm">${esc(d.genre||'')} · ${esc(d.year||'')} · ${esc(d.eps||'?')} eps · ${esc(d.status)}</div></div><div>${stars(d.rating)}</div>${heart(d)}</div>`.replace('class="heart','style="position:static" class="heart');
const opts=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
const ranked=()=>S.dramas.filter(d=>d.rating>0).sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title));
const empty=(m,b)=>`<div class="empty"><p>${m}</p>${b?`<button class="pri" data-act="add">Add a drama</button>`:''}</div>`;
/* views */
const V={
home(){const pk=S.dramas.filter(d=>d.top>0).sort((a,b)=>a.top-b.top).slice(0,3);const t=pk.length?pk:ranked().slice(0,3);const nm=S.settings.name;
 let h=`<div class="hero"><h1>${nm?`${esc(nm)}’s Top 3`:'My Top 3'}</h1><p>The Pakistani dramas I love most</p></div>`;
 if(!t.length)return h+empty('Rate a few dramas and your Top 3 will appear here.',1);
 const o=t.length===3?[1,0,2]:t.length===2?[1,0]:[0];
 return h+`<div class="top3">${o.map(i=>`<div class="p${i===0?' c':''}">${poster(t[i])}<div class="n">#${t[i].top||i+1}</div><div class="ct">${esc(t[i].title)}</div><div class="cm">${stars(t[i].rating)} ${rtxt(t[i].rating)}</div></div>`).join('')}</div>`},
dramas(){let l=S.dramas.filter(d=>ui.genre==='All'||d.genre===ui.genre).sort(SORT[ui.sort||'title']);
 return `<h2>Dramas</h2><p class="sub">${S.dramas.length} in your collection</p><div class="bar"><select data-chg="genre">${opts(['All',...GEN],ui.genre)}</select><select data-chg="sort">${[['title','A–Z'],['rating','Highest rated'],['year','Newest year'],['added','Recently added']].map(([v,t])=>`<option value="${v}"${(ui.sort||'title')===v?' selected':''}>${t}</option>`).join('')}</select><button data-act="mode" data-m="grid" class="${ui.mode==='grid'?'on':''}">Poster grid</button><button data-act="mode" data-m="list" class="${ui.mode==='list'?'on':''}">List</button><span class="sp"></span><button data-act="surprise">Pick something for me</button><button class="pri" data-act="add">Add drama</button></div>`+
 (!l.length?empty(S.dramas.length?'No dramas in this genre yet.':'Your library is empty.',!S.dramas.length):ui.mode==='grid'?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="list">${l.map(rowv).join('')}</div>`)},
drama(id){const d=byId(id);if(!d)return empty('That drama no longer exists.');
 const os=S.osts.filter(o=>o.drama.toLowerCase()===d.title.toLowerCase());
 return `<div class="bar"><button data-go="dramas">Back to dramas</button></div><div class="det"><div>${poster(d)}</div><div><h2>${esc(d.title)}</h2><div style="margin:8px 0">${d.genre?`<span class="chip">${esc(d.genre)}</span>`:''}<span class="chip">${esc(d.status)}</span></div>
 <div>${stars(d.rating,d.id)} <span class="cm">${rtxt(d.rating)}</span></div>
 <dl><dt>Favourite OST</dt><dd>${esc(d.ost||'—')}</dd><dt>Rewatch status</dt><dd><select data-chg="rewatch" data-id="${d.id}">${opts(REW,d.rewatch)}</select> <span class="cm">Rewatched ${d.rw||0}×</span><button class="mini" data-act="rw" data-id="${d.id}" data-d="-1">−</button><button class="mini" data-act="rw" data-id="${d.id}" data-d="1">+1</button></dd><dt>Status</dt><dd><select data-chg="status" data-id="${d.id}">${opts(STA,d.status)}</select></dd>${['Currently Watching','Airing','On Hold'].includes(d.status)&&+d.eps>0?`<dt>Progress</dt><dd><div class="pg" style="max-width:320px"><i style="width:${Math.min(100,(d.watched||0)/d.eps*100)}%"></i></div><div style="margin-top:8px"><button class="mini" style="margin:0 6px 0 0" data-act="ep" data-id="${d.id}" data-d="-1">−</button><b>Episode ${d.watched||0} of ${esc(d.eps)}</b><button class="mini" data-act="ep" data-id="${d.id}" data-d="1">+1</button></div></dd>`:''}${d.status==='Airing'&&hasAir(d)?`<dt>New episodes</dt><dd>Every ${DAYS[d.airday]}. ${airTxt(d)}</dd>`:''}<dt>Top 3 spot</dt><dd><select data-chg="top" data-id="${d.id}">${[[0,'Not in my Top 3'],[1,'#1 (centre)'],[2,'#2 (left)'],[3,'#3 (right)']].map(([v,t])=>`<option value="${v}"${(d.top||0)===v?' selected':''}>${t}</option>`).join('')}</select></dd><dt>Main cast</dt><dd>${castOf(d).length?castOf(d).map(n=>`<a class="actor" href="#actor/${encodeURIComponent(n)}">${esc(n)}</a>`).join(', '):'—'}</dd><dt>Total episodes</dt><dd>${esc(d.eps||'—')}</dd><dt>Release year</dt><dd>${esc(d.year||'—')}</dd><dt>Notes</dt><dd>${esc(d.notes||'—')}</dd><dt>Review</dt><dd>${d.review?spoil(d.review):'No review written yet.'}</dd>${os.length?`<dt>OSTs</dt><dd>${os.map(o=>`<a href="${esc(o.link)}" target="_blank" rel="noopener" style="color:var(--act)">${esc(o.title)}</a>`).join('<br>')}</dd>`:''}</dl>
 <div class="bar"><button class="pri" data-act="edit" data-id="${d.id}">Edit</button><button data-act="fav" data-id="${d.id}">${d.fav?'♥ Remove favourite':'♡ Add to favourites'}</button><button class="dng" data-act="del" data-id="${d.id}">Delete</button></div></div></div>`},
actor(id){let nm='';try{nm=decodeURIComponent(id||'')}catch{}const k=nm.toLowerCase(),l=S.dramas.filter(d=>castOf(d).some(n=>n.toLowerCase()===k)).sort(SORT.title);
 return `<div class="bar"><button data-go="dramas">Back to dramas</button></div><h2>${esc(nm)}</h2><p class="sub">${l.length} drama${l.length===1?'':'s'} in your collection</p>`+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty('No dramas with this actor yet.'))},
